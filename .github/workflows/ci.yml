name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-dummy-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: quality_control_hq_ci
      DB_USER: quality_control_hq_ci
      DB_PASSWORD: ci-only-dummy-password
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: quality_control_hq_ci
          POSTGRES_USER: quality_control_hq_ci
          POSTGRES_PASSWORD: ci-only-dummy-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality_control_hq_ci -d quality_control_hq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      # The Django test runner creates a separate PostgreSQL test database.
      # The service role owns the initial database and has CREATE DATABASE
      # permission for that test database.
      - name: Run backend checks and tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Scope Backend

      - name: Run production-like deployment checks
        env:
          APP_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-dummy-production-secret-9e2c6a7d4b1f0e8a6c3d5b7f9a1e4c8d2
          DJANGO_ALLOWED_HOSTS: ci.invalid
          APP_PUBLIC_URL: https://ci.invalid
          CSRF_TRUSTED_ORIGINS: https://ci.invalid
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_SSL_REDIRECT: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python backend/manage.py check --deploy --fail-level WARNING

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint and build
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Scope Frontend

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock --strict

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  secret-scan:
    name: secret-scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict --status
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${GITLEAKS_BASE_SHA}^{commit}"
          git cat-file -e "${GITLEAKS_HEAD_SHA}^{commit}"
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact \
            --log-opts="${GITLEAKS_BASE_SHA}..${GITLEAKS_HEAD_SHA}" .

      - name: Scan pushed main range
        if: github.event_name == 'push'
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITLEAKS_BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --log-opts="--all" .
          else
            git cat-file -e "${GITLEAKS_BASE_SHA}^{commit}"
            git cat-file -e "${GITLEAKS_HEAD_SHA}^{commit}"
            "${RUNNER_TEMP}/gitleaks" git --no-banner --redact \
              --log-opts="${GITLEAKS_BASE_SHA}..${GITLEAKS_HEAD_SHA}" .
          fi

  secret-scan-history:
    name: secret-scan-history
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict --status
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan full repository history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --log-opts="--all" .
